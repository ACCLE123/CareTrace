<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">CareTrace production Glance API P95 latency before and after co-locating the Vercel Function with Neon</title>
  <desc id="desc">The P95 fell from 6.970 seconds in Washington to 234 milliseconds in Singapore, below the 300 millisecond target.</desc>
  <rect width="1200" height="470" fill="#fbfcfa"/>
  <text x="70" y="62" fill="#172b28" font-family="Arial, sans-serif" font-size="28" font-weight="700">Production Glance API latency</text>
  <text x="70" y="92" fill="#69807a" font-family="Arial, sans-serif" font-size="16">16 sequential HTTPS requests · P95 end-to-end response time · 27 Aug 2026</text>
  <line x1="210" y1="385" x2="1110" y2="385" stroke="#9fb2aa" stroke-width="1"/>
  <g fill="#69807a" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="210" y="412">0s</text><text x="339" y="412">1s</text><text x="467" y="412">2s</text><text x="596" y="412">3s</text><text x="724" y="412">4s</text><text x="853" y="412">5s</text><text x="981" y="412">6s</text><text x="1110" y="412">7s</text>
  </g>
  <g stroke="#dce5e1" stroke-width="1">
    <line x1="339" y1="150" x2="339" y2="385"/><line x1="467" y1="150" x2="467" y2="385"/><line x1="596" y1="150" x2="596" y2="385"/><line x1="724" y1="150" x2="724" y2="385"/><line x1="853" y1="150" x2="853" y2="385"/><line x1="981" y1="150" x2="981" y2="385"/><line x1="1110" y1="150" x2="1110" y2="385"/>
  </g>
  <line x1="249" y1="132" x2="249" y2="385" stroke="#0c7560" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="257" y="146" fill="#0c7560" font-family="Arial, sans-serif" font-size="13" font-weight="700">300ms target</text>
  <text x="70" y="210" fill="#172b28" font-family="Arial, sans-serif" font-size="17" font-weight="700">Before</text>
  <text x="70" y="234" fill="#69807a" font-family="Arial, sans-serif" font-size="14">Vercel iad1 → Neon Singapore</text>
  <rect x="210" y="180" width="896" height="62" rx="5" fill="#c95c58"/>
  <text x="1120" y="218" fill="#ad403c" font-family="Arial, sans-serif" font-size="23" font-weight="700">6.970s</text>
  <text x="70" y="312" fill="#172b28" font-family="Arial, sans-serif" font-size="17" font-weight="700">After</text>
  <text x="70" y="336" fill="#69807a" font-family="Arial, sans-serif" font-size="14">Vercel sin1 → Neon Singapore</text>
  <rect x="210" y="282" width="30" height="62" rx="5" fill="#0c7560"/>
  <text x="255" y="320" fill="#0c7560" font-family="Arial, sans-serif" font-size="23" font-weight="700">234ms</text>
  <text x="930" y="330" fill="#0c7560" font-family="Arial, sans-serif" font-size="16" font-weight="700">29.8× faster · target met</text>
</svg>

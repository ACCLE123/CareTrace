services:
  db:
    profiles: ["local-postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caretrace
      POSTGRES_USER: caretrace
      POSTGRES_PASSWORD: caretrace_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caretrace -d caretrace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    env_file:
      - .env.local
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - web

volumes:
  postgres_data:

[project]
name = "caretrace-api"
version = "0.1.0"
description = "Traceable longitudinal care-note API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0",
  "psycopg[binary]==3.2.13",
  "uvicorn[standard]==0.39.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

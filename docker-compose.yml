services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caretrace
      POSTGRES_USER: caretrace
      POSTGRES_PASSWORD: caretrace_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caretrace -d caretrace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://caretrace:caretrace_dev_only@db:5432/caretrace
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:

